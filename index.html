<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Навигация ЗАБИЖТ
</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color"
content="#066666">

<style>

body{

margin:0;
padding:20px;
font-family:Arial,sans-serif;

background:
linear-gradient(
180deg,
#012c2c,
#066666,
#11baba
);

color:white;

min-height:100vh;

transition:0.5s;

}

.dark{

background:
linear-gradient(
180deg,
#000000,
#111111,
#222222
);

}

.loader{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:#022f2f;

display:flex;

justify-content:center;
align-items:center;

font-size:35px;
font-weight:bold;

z-index:9999;

animation:hideLoader 2s forwards;

}

@keyframes hideLoader{

0%{
opacity:1;
}

80%{
opacity:1;
}

100%{
opacity:0;
visibility:hidden;
}

}

h1{

text-align:center;
font-size:38px;

}

.subtitle{

text-align:center;
margin-bottom:30px;

}

.top-buttons{

display:flex;
gap:10px;

margin-bottom:20px;

}

.top-btn{

flex:1;

padding:15px;

border:none;

border-radius:15px;

background:#033c3c;

color:white;

font-size:18px;
font-weight:bold;

}

.search{

width:100%;

padding:18px;

border:none;

border-radius:18px;

font-size:20px;

margin-bottom:15px;

}

button{

width:100%;

padding:22px;

margin-top:15px;

border:none;

border-radius:20px;

background:#033c3c;

color:white;

font-size:24px;
font-weight:bold;

cursor:pointer;

transition:0.3s;

}

button:hover{

transform:scale(1.03);

background:#055555;

}

button:active{

transform:scale(0.96);

}

.route{

margin-top:25px;

background:white;

color:black;

padding:20px;

border-radius:20px;

font-size:19px;

line-height:1.8;

animation:fade 0.5s;

}

@keyframes fade{

from{

opacity:0;
transform:translateY(20px);

}

to{

opacity:1;
transform:translateY(0);

}

}

.step{

background:#e8ffff;

padding:15px;

margin-top:10px;

border-radius:15px;

animation:slide 0.5s;

}

@keyframes slide{

from{

opacity:0;
transform:translateX(-30px);

}

to{

opacity:1;
transform:translateX(0);

}

}

.bottom-menu{

position:fixed;

bottom:0;
left:0;

width:100%;

background:#033c3c;

display:flex;

justify-content:space-around;

padding:12px 0;

}

.menu-item{

text-align:center;

font-size:16px;

}

.footer-space{

height:90px;

}

</style>

</head>

<body>

<div class="loader">

Загрузка ЗАБИЖТ...

</div>

<h1>
Навигация ЗАБИЖТ
</h1>

<div class="subtitle">
Навигация по колледжу
</div>

<div class="top-buttons">

<button
class="top-btn"
onclick="toggleTheme()"
>
🌙 Тема
</button>

</div>

<input
type="text"
id="searchInput"
class="search"
placeholder="Введите кабинет например 4.38"
>

<button
onclick="searchRoom()"
>
🔍 Найти кабинет
</button>

<button onclick="showRoute('433')">
4.33
</button>

<button onclick="showRoute('434')">
4.34
</button>

<button onclick="showRoute('436')">
4.36
</button>

<button onclick="showRoute('437')">
4.37
</button>

<button onclick="showRoute('438')">
4.38
</button>

<button onclick="showRoute('food')">
🍽 Столовая
</button>

<div
id="route"
class="route"
>
Выберите кабинет
</div>

<div class="footer-space"></div>

<div class="bottom-menu">

<div class="menu-item">
🏠<br>
Главная
</div>

<div class="menu-item">
🔍<br>
Поиск
</div>

<div class="menu-item">
ℹ️<br>
О приложении
</div>

</div>

<script>

function toggleTheme(){

document.body.classList.toggle("dark");

}

function searchRoom(){

const value =

document
.getElementById("searchInput")
.value
.trim();

if(value==="4.33"){
showRoute("433");
}

else if(value==="4.34"){
showRoute("434");
}

else if(value==="4.36"){
showRoute("436");
}

else if(value==="4.37"){
showRoute("437");
}

else if(value==="4.38"){
showRoute("438");
}

else{

document
.getElementById("route")
.innerHTML =
"❌ Кабинет не найден";

}

}

function showRoute(room){

const route =

document
.getElementById("route");

if(room==="433"){

route.innerHTML =

"<h2>📍 Кабинет 4.33</h2>" +

"<div class='step'>1️⃣ Поднимитесь по правой лестнице на 4 этаж</div>" +

"<div class='step'>2️⃣ После лестницы идите прямо</div>" +

"<div class='step'>3️⃣ Кабинет будет слева</div>";

}

if(room==="434"){

route.innerHTML =

"<h2>📍 Кабинет 4.34</h2>" +

"<div class='step'>1️⃣ Поднимитесь на 4 этаж</div>" +

"<div class='step'>2️⃣ Идите прямо</div>" +

"<div class='step'>3️⃣ Кабинет рядом с 4.33</div>";

}

if(room==="436"){

route.innerHTML =

"<h2>📍 Кабинет 4.36</h2>" +

"<div class='step'>1️⃣ Поднимитесь на 4 этаж</div>" +

"<div class='step'>2️⃣ Идите прямо по коридору</div>" +

"<div class='step'>3️⃣ Пройдите 4.33 и 4.34</div>" +

"<div class='step'>4️⃣ Кабинет дальше по коридору</div>";

}

if(room==="437"){

route.innerHTML =

"<h2>📍 Кабинет 4.37</h2>" +

"<div class='step'>1️⃣ Поднимитесь на 4 этаж</div>" +

"<div class='step'>2️⃣ Идите прямо</div>" +

"<div class='step'>3️⃣ Кабинет после 4.36</div>";

}

if(room==="438"){

route.innerHTML =

"<h2>📍 Кабинет 4.38</h2>" +

"<div class='step'>1️⃣ Поднимитесь на 4 этаж</div>" +

"<div class='step'>2️⃣ Идите прямо по коридору</div>" +

"<div class='step'>3️⃣ Кабинет последний в ряду</div>";

}

if(room==="food"){

route.innerHTML =

"<h2>🍽 Столовая</h2>" +

"<div class='step'>1️⃣ Спуститесь на 1 этаж</div>" +

"<div class='step'>2️⃣ Идите прямо</div>" +

"<div class='step'>3️⃣ Поверните налево</div>";

}

route.scrollIntoView({

behavior:'smooth'

});

}

if ('serviceWorker' in navigator) {

navigator
.serviceWorker
.register('sw.js');

}

</script>

</body>
</html>
