<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Навигация ЗАБИЖТ</title>

<style>

body{
margin:0;
padding:20px;
font-family:Arial;
background:linear-gradient(180deg,#022f2f,#0d8f8f,#37d4d4);
color:white;
}

h1{
text-align:center;
font-size:34px;
}

.subtitle{
text-align:center;
margin-bottom:25px;
font-size:18px;
}

.search{
width:100%;
padding:18px;
border:none;
border-radius:18px;
font-size:20px;
margin-bottom:15px;
}

.search-btn{
width:100%;
padding:18px;
border:none;
border-radius:18px;
background:#033c3c;
color:white;
font-size:22px;
font-weight:bold;
margin-bottom:30px;
}

.map{
background:white;
color:black;
padding:20px;
border-radius:20px;
margin-bottom:30px;
}

.room{
display:inline-block;
padding:15px;
margin:10px;
background:#0d8f8f;
color:white;
border-radius:15px;
font-weight:bold;
}

button{
width:100%;
padding:20px;
margin-top:15px;
border:none;
border-radius:20px;
background:#033c3c;
color:white;
font-size:22px;
font-weight:bold;
}

#route{
margin-top:30px;
background:white;
color:black;
padding:20px;
border-radius:20px;
font-size:18px;
line-height:1.7;
}

</style>
</head>

<body>

<h1>Навигация ЗАБИЖТ</h1>

<div class="subtitle">
Поиск кабинета и карта этажа
</div>

<input
type="text"
id="searchInput"
class="search"
placeholder="Введите кабинет например 4.38"
>

<button class="search-btn" onclick="searchRoom()">
🔍 Найти кабинет
</button>

<div class="map">

<h2>
🗺 Карта 4 этажа
</h2>

<div class="room">4.33</div>
<div class="room">4.34</div>
<div class="room">4.36</div>
<div class="room">4.37</div>
<div class="room">4.38</div>
<div class="room">🍽 Столовая</div>

</div>

<button onclick="showRoute('433')">
Кабинет 4.33
</button>

<button onclick="showRoute('434')">
Кабинет 4.34
</button>

<button onclick="showRoute('436')">
Кабинет 4.36
</button>

<button onclick="showRoute('437')">
Кабинет 4.37
</button>

<button onclick="showRoute('438')">
Кабинет 4.38
</button>

<button onclick="showRoute('food')">
🍽 Столовая
</button>

<div id="route">
Нажмите на кабинет или воспользуйтесь поиском
</div>

<script>

function searchRoom(){

const value =
document.getElementById("searchInput")
.value
.trim();

if(value==="4.33"){
showRoute("433");
}

else if(value==="4.34"){
showRoute("434");
}

else if(value==="4.36"){
showRoute("436");
}

else if(value==="4.37"){
showRoute("437");
}

else if(value==="4.38"){
showRoute("438");
}

else{

document.getElementById("route")
.innerHTML =
"❌ Кабинет не найден";

}

}

function showRoute(room){

const route =
document.getElementById("route");

if(room==="433"){

route.innerHTML =
"📍 Маршрут до 4.33<br><br>\
1. Поднимитесь на 4 этаж.<br>\
2. Поверните направо.<br>\
3. Кабинет будет слева.";

}

if(room==="434"){

route.innerHTML =
"📍 Маршрут до 4.34<br><br>\
1. Поднимитесь на 4 этаж.<br>\
2. Идите прямо по коридору.";

}

if(room==="436"){

route.innerHTML =
"📍 Маршрут до 4.36<br><br>\
1. Поднимитесь на 4 этаж.<br>\
2. Пройдите мимо 4.34.";

}

if(room==="437"){

route.innerHTML =
"📍 Маршрут до 4.37<br><br>\
1. Поднимитесь на 4 этаж.<br>\
2. Кабинет справа.";

}

if(room==="438"){

route.innerHTML =
"📍 Маршрут до 4.38<br><br>\
1. Поднимитесь на 4 этаж.<br>\
2. Кабинет рядом со столовой.";

}

if(room==="food"){

route.innerHTML =
"📍 Маршрут до столовой<br><br>\
1. Спуститесь на 1 этаж.<br>\
2. Идите прямо.";

}

route.scrollIntoView({
behavior:'smooth'
});

}

</script>

</body>
</html>
