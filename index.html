<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Навигация ЗАБИЖТ</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d8f8f">

<style>

body{
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(180deg,#032b2b,#0d8f8f,#38cfcf);
    min-height:100vh;
    color:white;
    overflow-y:auto;
}

.header{
    text-align:center;
    padding:30px 20px 10px;
}

.logo{
    width:140px;
    height:140px;
    border-radius:30px;
    box-shadow:0 0 20px rgba(255,255,255,0.3);
}

.title{
    font-size:34px;
    font-weight:bold;
    margin-top:15px;
    color:white;
}

.subtitle{
    margin-top:10px;
    font-size:18px;
    color:#dfffff;
}

.container{
    padding:20px;
    max-width:500px;
    margin:auto;
}

.card{
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(10px);
    border-radius:25px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
}

.room-btn{
    width:100%;
    padding:20px;
    margin-top:15px;
    border:none;
    border-radius:20px;
    background:linear-gradient(90deg,#00d2d2,#007777);
    color:white;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.room-btn:hover{
    transform:scale(1.03);
    background:linear-gradient(90deg,#38ffff,#009999);
}

.route{
    margin-top:20px;
    padding:20px;
    border-radius:20px;
    background:rgba(0,0,0,0.25);
    font-size:18px;
    line-height:1.7;
    display:none;
}

.footer{
    text-align:center;
    padding:30px;
    color:#dfffff;
    font-size:14px;
}

</style>
</head>
<body>

<div class="header">

<img src="logo.png" class="logo">

<div class="title">
Навигация ЗАБИЖТ
</div>

<div class="subtitle">
Выберите кабинет для маршрута
</div>

</div>

<div class="container">

<div class="card">

<button class="room-btn" onclick="showRoute('433')">
Кабинет 4.33
</button>

<button class="room-btn" onclick="showRoute('434')">
Кабинет 4.34
</button>

<button class="room-btn" onclick="showRoute('436')">
Кабинет 4.36
</button>

<button class="room-btn" onclick="showRoute('437')">
Кабинет 4.37
</button>

<button class="room-btn" onclick="showRoute('438')">
Кабинет 4.38
</button>

<button class="room-btn" onclick="showRoute('food')">
Столовая
</button>

<div class="route" id="routeBox"></div>

</div>

</div>

<div class="footer">
Лицей ЗАБИЖТ • QR Навигация
</div>

<script>

function showRoute(room){

const box=document.getElementById("routeBox");

box.style.display="block";

if(room==="433"){
box.innerHTML=
"📍 Маршрут до 4.33<

1. Поднимитесь на 4 этаж по главной лестнице.<

2. После лестницы поверните направо.<

3. Идите прямо до конца коридора.<

4. Кабинет 4.33 будет слева рядом с 4.34.";
}

if(room==="434"){
box.innerHTML=
"📍 Маршрут до 4.34<b

1. Поднимитесь на 4 этаж.<b
2. Поверните направо после лестницы.<b
3. Идите прямо по длинному коридору.<b
4. Кабинет 4.34 находится слева.";
}

if(room==="436"){
box.innerHTML=
"📍 Маршрут до 4.36<br

. Поднимитесь на 4 этаж.<br
. Идите прямо от лестницы.<br
. Пройдите мимо кабинетов 4.33 и 4.34.<br
. Кабинет 4.36 будет справа.";
}

if(room==="437"){
box.innerHTML=
"📍 Маршрут до 4.37

 Поднимитесь на 4 этаж.

 Поверните направо.

 Двигайтесь прямо по коридору.

 После кабинета 4.36 увидите кабинет 4.37.";
}

if(room==="438"){
box.innerHTML=
"📍 Маршрут до 4.38
<

Поднимитесь на 4 этаж.
\
Идите по коридору прямо.
\
Кабинет находится рядом с зоной столовой.
\
Табличка 4.38 будет слева.";
}

if(room==="food"){
box.innerHTML=
"📍 Маршрут до столовой
<b

пуститесь на 1 этаж.
\

т центрального входа идите прямо.
\

оверните налево по указателю 'Столовая'.
\

толовая находится в конце коридора.";
}

}

if('serviceWorker' in navigator){
navigator.serviceWorker.register('sw.js');
}

</script>

</body>
</html>
