<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Навигация ЗАБИЖТ</title>

<style>

body{
margin:0;
padding:20px;
font-family:Arial,sans-serif;
background:linear-gradient(180deg,#012c2c,#066666,#11baba);
color:white;
min-height:100vh;
}

h1{
text-align:center;
font-size:38px;
margin-bottom:10px;
}

.subtitle{
text-align:center;
font-size:18px;
margin-bottom:30px;
opacity:0.9;
}

.search-box{
display:flex;
gap:10px;
margin-bottom:30px;
}

.search{
flex:1;
padding:18px;
border:none;
border-radius:18px;
font-size:20px;
outline:none;
}

.search-btn{
padding:18px 25px;
border:none;
border-radius:18px;
background:#033c3c;
color:white;
font-size:20px;
font-weight:bold;
cursor:pointer;
}

.search-btn:hover{
background:#055555;
}

.card{
background:white;
color:black;
padding:25px;
border-radius:25px;
margin-bottom:25px;
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.card h2{
margin-top:0;
color:#055555;
}

.room-btn{
width:100%;
padding:22px;
margin-top:15px;
border:none;
border-radius:20px;
background:#033c3c;
color:white;
font-size:24px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

.room-btn:hover{
transform:scale(1.03);
background:#055555;
}

.route{
margin-top:25px;
background:#f5f5f5;
padding:20px;
border-radius:20px;
font-size:19px;
line-height:1.8;
border-left:8px solid #0d8f8f;
animation:fade 0.5s;
}

@keyframes fade{

from{
opacity:0;
transform:translateY(20px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.steps{
margin-top:20px;
}

.step{
background:#e8ffff;
padding:15px;
margin-top:10px;
border-radius:15px;
font-size:18px;
animation:slide 0.4s;
}

@keyframes slide{

from{
opacity:0;
transform:translateX(-30px);
}

to{
opacity:1;
transform:translateX(0);
}

}

.footer{
margin-top:40px;
text-align:center;
font-size:16px;
opacity:0.8;
}

</style>
</head>

<body>

<h1>
Навигация ЗАБИЖТ
</h1>

<div class="subtitle">
Навигация по 4 этажу
</div>

<div class="search-box">

<input
type="text"
id="searchInput"
class="search"
placeholder="Введите кабинет например 4.38"
>

<button
class="search-btn"
onclick="searchRoom()"
>
🔍
</button>

</div>

<div class="card">

<h2>
📍 Быстрый выбор кабинета
</h2>

<button
class="room-btn"
onclick="showRoute('433')"
>
4.33
</button>

<button
class="room-btn"
onclick="showRoute('434')"
>
4.34
</button>

<button
class="room-btn"
onclick="showRoute('436')"
>
4.36
</button>

<button
class="room-btn"
onclick="showRoute('437')"
>
4.37
</button>

<button
class="room-btn"
onclick="showRoute('438')"
>
4.38
</button>

<button
class="room-btn"
onclick="showRoute('food')"
>
🍽 Столовая
</button>

<div
id="route"
class="route"
>
Выберите кабинет или воспользуйтесь поиском
</div>

</div>

<div class="footer">
ЗАБИЖТ Navigation System
</div>

<script>

function searchRoom(){

const value =
document
.getElementById("searchInput")
.value
.trim();

if(value==="4.33"){
showRoute("433");
}

else if(value==="4.34"){
showRoute("434");
}

else if(value==="4.36"){
showRoute("436");
}

else if(value==="4.37"){
showRoute("437");
}

else if(value==="4.38"){
showRoute("438");
}

else{

document
.getElementById("route")
.innerHTML =
"❌ Кабинет не найден";

}

}

function showRoute(room){

const route =
document.getElementById("route");

if(room==="433"){

route.innerHTML =

"<h2>📍 Кабинет 4.33</h2>" +

"<div class='steps'>" +

"<div class='step'>1️⃣ Поднимитесь по правой лестнице на 4 этаж</div>" +

"<div class='step'>2️⃣ После лестницы идите прямо</div>" +

"<div class='step'>3️⃣ Кабинет будет слева</div>" +

"</div>";

}

if(room==="434"){

route.innerHTML =

"<h2>📍 Кабинет 4.34</h2>" +

"<div class='steps'>" +

"<div class='step'>1️⃣ Поднимитесь на 4 этаж</div>" +

"<div class='step'>2️⃣ Идите прямо после лестницы</div>" +

"<div class='step'>3️⃣ Кабинет находится рядом с 4.33</div>" +

"</div>";

}

if(room==="436"){

route.innerHTML =

"<h2>📍 Кабинет 4.36</h2>" +

"<div class='steps'>" +

"<div class='step'>1️⃣ Поднимитесь на 4 этаж</div>" +

"<div class='step'>2️⃣ Идите прямо по коридору</div>" +

"<div class='step'>3️⃣ Пройдите кабинеты 4.33 и 4.34</div>" +

"<div class='step'>4️⃣ Кабинет будет дальше по коридору</div>" +

"</div>";

}

if(room==="437"){

route.innerHTML =

"<h2>📍 Кабинет 4.37</h2>" +

"<div class='steps'>" +

"<div class='step'>1️⃣ Поднимитесь на 4 этаж</div>" +

"<div class='step'>2️⃣ Идите прямо по коридору</div>" +

"<div class='step'>3️⃣ Кабинет будет после 4.36</div>" +

"</div>";

}

if(room==="438"){

route.innerHTML =

"<h2>📍 Кабинет 4.38</h2>" +

"<div class='steps'>" +

"<div class='step'>1️⃣ Поднимитесь на 4 этаж</div>" +

"<div class='step'>2️⃣ Идите прямо по коридору</div>" +

"<div class='step'>3️⃣ Кабинет будет последним в ряду</div>" +

"</div>";

}

if(room==="food"){

route.innerHTML =

"<h2>🍽 Столовая</h2>" +

"<div class='steps'>" +

"<div class='step'>1️⃣ Спуститесь на 1 этаж</div>" +

"<div class='step'>2️⃣ Идите прямо по коридору</div>" +

"<div class='step'>3️⃣ Поверните налево</div>" +

"<div class='step'>4️⃣ Столовая будет впереди</div>" +

"</div>";

}

route.scrollIntoView({
behavior:'smooth'
});

}

</script>

</body>
</html>
