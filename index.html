<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Навигация ЗАБИЖТ</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d8f8f">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:linear-gradient(180deg,#022f2f,#0d8f8f,#37d4d4);
min-height:100vh;
color:white;
overflow-y:auto;
}

.header{
text-align:center;
padding:30px 20px;
}

.logo{
width:150px;
height:150px;
border-radius:35px;
box-shadow:0 0 25px rgba(255,255,255,0.3);
margin-bottom:20px;
}

.title{
font-size:36px;
font-weight:bold;
margin-bottom:10px;
}

.subtitle{
font-size:18px;
color:#d9ffff;
}

.container{
max-width:500px;
margin:auto;
padding:20px;
}

.card{
background:rgba(255,255,255,0.12);
backdrop-filter:blur(12px);
border-radius:30px;
padding:25px;
box-shadow:0 0 25px rgba(0,0,0,0.35);
margin-bottom:40px;
}

.room-btn{
width:100%;
padding:22px;
margin-top:18px;
border:none;
border-radius:22px;
background:linear-gradient(90deg,#00dede,#006d6d);
color:white;
font-size:22px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

.room-btn:hover{
transform:scale(1.03);
background:linear-gradient(90deg,#59ffff,#009393);
}

.route{
margin-top:25px;
padding:22px;
border-radius:22px;
background:rgba(0,0,0,0.3);
font-size:18px;
line-height:1.8;
display:none;
}

.footer{
text-align:center;
padding:30px;
font-size:14px;
color:#d9ffff;
}

</style>
</head>

<body>

<div class="header">

<img src="logo.png" class="logo">

<div class="title">
Навигация ЗАБИЖТ
</div>

<div class="subtitle">
Выберите кабинет для маршрута
</div>

</div>

<div class="container">

<div class="card">

<button class="room-btn" onclick="showLocation()">
📍 Где я?
</button>

<button class="room-btn" onclick="showRoute('433')">
Кабинет 4.33
</button>

<button class="room-btn" onclick="showRoute('434')">
Кабинет 4.34
</button>

<button class="room-btn" onclick="showRoute('436')">
Кабинет 4.36
</button>

<button class="room-btn" onclick="showRoute('437')">
Кабинет 4.37
</button>

<button class="room-btn" onclick="showRoute('438')">
Кабинет 4.38
</button>

<button class="room-btn" onclick="showRoute('food')">
🍽 Столовая
</button>

<div class="route" id="routeBox"></div>

</div>

</div>

<div class="footer">
Лицей ЗАБИЖТ • QR Навигация
</div>

const box=document.getElementById("routeBox");

box.style.display="block";

const params = new URLSearchParams(window.location.search);

const place = params.get("place");

if(place==="floor4"){

box.innerHTML=
"📍 Вы сейчас на 4 этаже<br

ядом находятся:<br
 Кабинет 4.33<br

 Кабинет 4.37<br
 Кабинет 4.38";

}

else if(place==="floor1"){

box.innerHTML=
"📍 Вы сейчас на 1 этаже

дом находится столовая.";

box.innerHTML=
"📍 Местоположение не определено.
<

канируйте QR-код этажа.";

}

}

\

абинет 4.33 будет слева рядом с кабинетом 4.34.";

}

йдите кабинеты 4.33 и 4.34.
\

инет 4.36 будет справа.";

рните направо.

    дет слева.";

}

if(room==="food"){

box.innerHTML=
"📍 Маршрут до столовой

\
1

тесь на 1 этаж.
\

трального входа идите прямо.

\

}

}

navigator.serviceWorker.register('sw.js');
}

</script>

</body>
